[build]
  publish = "public"
  command = ""

# Manual zip deploys upload only public/, so Netlify never reads this file.
# The live headers come from public/_headers; keep the two in sync.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

